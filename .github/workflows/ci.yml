name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: [self-hosted, wsl]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Also part of npm test; a separate step shows a time zone failure.
      - run: npm run test:tz
      - run: npm run build
      - run: npm run test:ssr
      # `npm run seed:remote` runs the seed under plain Node (type stripping),
      # which vitest and tsc do not check.
      - run: node --import ./scripts/ts-resolve.mjs -e "await import('./src/server/db/seed/sql.ts')"

  deploy:
    name: deploy
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, wsl]
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      # account_id is set in wrangler.jsonc.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Before the build: after `vite build`, wrangler reads the redirected
      # config in dist/.
      - run: npx wrangler d1 migrations apply DB --remote
      - run: npm run deploy
